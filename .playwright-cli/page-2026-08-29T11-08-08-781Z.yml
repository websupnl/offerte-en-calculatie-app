            - heading "Vervanging laadpunt en slimme energiesturing" [level=2] [ref=e72]
            - generic [ref=e73]:
              - paragraph [ref=e74]: Beste Bauke,
              - paragraph [ref=e75]: Ik ben gevraagd om mee te denken over het laadprobleem sinds uw overstap naar de Kia EV3, en hoe uw installaties slimmer kunnen samenwerken. De Kia EV3 vraagt namelijk langer een hoger vermogen dan uw eerdere hybride auto, waardoor de huidige capaciteit van uw 3x25A-aansluiting kan worden overschreden als andere grote energieverbruikers in huis tegelijkertijd actief zijn.
              - paragraph [ref=e76]: Mijn advies is het Webasto Pure-laadpunt te vervangen door een Sigen EV AC met 11 kW en dynamische load balancing, welke zal samenwerken met uw bestaande SigenStor-thuisbatterij en Solaredge-zonnepanelen. Deze oplossing voorkomt dat de hoofdaansluiting wordt overbelast door het laadvermogen aan te passen aan het actuele verbruik in huis, zonder dat andere systemen in de weg zitten.
              - paragraph [ref=e77]: Met deze aanpak kunt u genieten van efficiënter energiegebruik, slimmer laden en lagere energiekosten door gebruik te maken van zonne-overschotten en dynamische energietarieven. Bovendien blijft de al aanwezige apparatuur, zoals de SolarEdge-installatie, intact.
              - paragraph [ref=e78]: Voorafgaand aan de uitvoering controleer ik dat de Sigen Power Sensor correct ingesteld is als hoofdmeting, zodat deze het totale energieverbruik en de teruglevering nauwkeurig registreert.
