                  - heading "Dynamische load balancing" [level=4] [ref=e109]
                  - paragraph [ref=e110]: Het laadvermogen past zich aan het actuele stroomverbruik in de woning aan. Zo wordt de 3x25A-aansluiting benut zonder dat het laadpunt andere grote verbruikers negeert. [1]
              - generic [ref=e111]:
                - generic [ref=e112]: "02"
                - generic [ref=e113]:
                  - heading "Laden op zonne-overschot" [level=4] [ref=e114]
                  - paragraph [ref=e115]: Wanneer de hoofdmeting netto teruglevering ziet, kan het beschikbare overschot worden gebruikt om de auto te laden. De bestaande SolarEdge-installatie kan behouden blijven. [1]
              - generic [ref=e116]:
                - generic [ref=e117]: "03"
                - generic [ref=e118]:
                  - heading "Laden bij dynamische prijzen" [level=4] [ref=e119]
                  - paragraph [ref=e120]: Sigenergy ondersteunt dynamische tarieven en kan laadmomenten verschuiven naar goedkopere perioden. Tibber rekent de elektriciteitsprijs af op basis van EPEX Day Ahead-prijzen. [1] [4]
              - generic [ref=e121]:
                - generic [ref=e122]: "04"
                - generic [ref=e123]:
                  - heading "Afstemming met de thuisbatterij" [level=4] [ref=e124]
                  - paragraph [ref=e125]: De SigenStor en het laadpunt werken binnen hetzelfde energiesysteem. Daardoor kunnen zonne-energie, batterij en autoladen vanuit dezelfde meting en laadstrategie worden aangestuurd. [1]
              - generic [ref=e126]:
                - generic [ref=e127]: "05"
                - generic [ref=e128]:
                  - heading "Warmte maken op een gunstig moment" [level=4] [ref=e129]
                  - paragraph [ref=e130]: Met SG Ready kan de warmtepomp een signaal krijgen voor een verhoogde bedrijfsstand, bijvoorbeeld bij zonne-overschot. De warmtepomp bewaakt zelf haar temperaturen en beveiligingen. [2]
              - generic [ref=e131]:
                - generic [ref=e132]: "06"
                - generic [ref=e133]:
                  - heading "V2G en V2H" [level=4] [ref=e134]
                  - paragraph [ref=e135]: De Sigen EV AC is niet bidirectioneel. De Kia EV3 is voorbereid op V2G en V2H, maar deze functies zijn in Nederland nog niet regulier beschikbaar. Easee Charge Max is hardwarematig voorbereid, zonder dat dit de dienst vandaag beschikbaar maakt. [3] [5]
