                - generic [ref=e154]:
                  - heading "Samenwerking met de thuisbatterij" [level=4] [ref=e155]
                  - paragraph [ref=e156]:
                    - text: De SigenStor en het laadpunt werken binnen hetzelfde systeem. Afhankelijk van de gekozen laadmodus kunnen zonne-energie, het elektriciteitsnet en de thuisbatterij samen worden gebruikt voor het laden van de auto. De laadstrategie wordt ingesteld in mySigen.
                    - 'link "Bron 1: Sigenergy, Sigen EV AC Charger" [ref=e157] [cursor=pointer]':
                      - /url: https://eu-store.sigenergy.com/en/pages/sigenstor-ev-ac
                      - text: Bron 1
