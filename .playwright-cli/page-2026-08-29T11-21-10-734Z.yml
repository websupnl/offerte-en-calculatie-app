                  - paragraph [ref=e166]:
                    - text: SG Ready is een stuursignaal naar de warmtepomp. Bij bijvoorbeeld zonne-overschot kan Sigenergy een verhoogde bedrijfsstand adviseren. De warmtepomp bepaalt binnen haar eigen regeling of extra energie naar warm water, vloerverwarming of andere warmteopslag kan gaan.
                    - 'link "Bron 2: Alpha Innotec, SG Ready-interface" [ref=e167] [cursor=pointer]':
