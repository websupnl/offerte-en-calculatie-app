                  - paragraph [ref=e121]:
                    - text: Het laadvermogen wordt automatisch aangepast aan het overige stroomverbruik. Is er voldoende capaciteit beschikbaar, dan kan de auto sneller laden. Wordt elders meer stroom gebruikt, dan verlaagt het laadpunt het laadvermogen. Zo wordt de 3x25A-aansluiting beter benut en wordt overbelasting voorkomen.
                    - 'link "Bron 1: Sigenergy, Sigen EV AC Charger" [ref=e122] [cursor=pointer]':
                      - /url: https://eu-store.sigenergy.com/en/pages/sigenstor-ev-ac
                      - text: Bron 1
