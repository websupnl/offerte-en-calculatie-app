                - generic [ref=e139]:
                  - heading "Laden op gunstige energieprijzen" [level=4] [ref=e140]
                  - paragraph [ref=e141]:
                    - text: Sigenergy kan rekening houden met dynamische tarieven en het laden verschuiven naar goedkopere momenten. Het dynamische Tibber-tarief volgt de EPEX Day Ahead-markt. Voor deze prijssturing is geen rechtstreekse koppeling tussen Tibber en het laadpunt nodig.
                    - 'link "Bron 1: Sigenergy, Sigen EV AC Charger" [ref=e142] [cursor=pointer]':
