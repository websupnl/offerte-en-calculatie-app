            - heading "Vervanging laadpunt en slimme energiesturing" [level=2] [ref=e72]
            - generic [ref=e73]:
              - paragraph [ref=e74]: Beste Bauke,
              - paragraph [ref=e75]: U heeft mij gevraagd mee te denken over het laadprobleem sinds de overstap naar de Kia EV3 en over de mogelijkheden om uw installaties slimmer samen te laten werken.
              - paragraph [ref=e76]: Uw woning beschikt over een 3x25A-aansluiting, een Webasto Pure-laadpunt van maximaal 11 kW, een SolarEdge-zonnepaneleninstallatie, een SigenStor-thuisbatterij van 16,12 kWh en een Alpha Innotec SWC V-serie warmtepomp. Daarnaast maakt u gebruik van een dynamisch energiecontract bij Tibber.
              - paragraph [ref=e77]: Met uw eerdere hybride auto gaf het laden geen problemen. De Kia EV3 vraagt tijdens het laden langer een hoger vermogen. In combinatie met andere grote stroomverbruikers kan daardoor de beschikbare capaciteit van de 3x25A-aansluiting worden overschreden.
              - paragraph [ref=e78]: Ik adviseer het huidige Webasto Pure-laadpunt te vervangen door een Sigen EV AC 11 kW met dynamische load balancing. Omdat er al een SigenStor aanwezig is, is voor deze uitvoering geen apart energiemanagementsysteem nodig. Het laadpunt wordt opgenomen in hetzelfde Sigenergy-systeem en gebruikt de bestaande energiemeting.
              - paragraph [ref=e79]:
                - text: Ik ga ervan uit dat de aanwezige Sigen Power Sensor als hoofdmeting in de meterkast is aangesloten en de totale afname en teruglevering van de woning meet. Op basis daarvan kan Sigenergy het laadvermogen automatisch aanpassen aan wat er op dat moment in de woning gebeurt.
                - 'link "Bron 1: Sigenergy, Sigen EV AC Charger" [ref=e80] [cursor=pointer]':
                  - /url: https://eu-store.sigenergy.com/en/pages/sigenstor-ev-ac
                  - text: Bron 1
                  - img [ref=e81]
                - text: Als uitbreiding kan ook de Alpha Innotec-warmtepomp via SG Ready worden aangestuurd.
                - 'link "Bron 2: Alpha Innotec, SG Ready-interface" [ref=e85] [cursor=pointer]':
                  - /url: https://www.alpha-innotec.com/en/knowledge-base/heat-pump-knowledge-center/sg-ready-interface-for-heat-pumps
                  - text: Bron 2
