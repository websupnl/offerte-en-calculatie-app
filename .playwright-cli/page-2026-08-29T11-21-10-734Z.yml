                - generic [ref=e129]:
                  - heading "Laden met beschikbare zonne-energie" [level=4] [ref=e130]
                  - paragraph [ref=e131]:
                    - text: De hoofdmeting ziet wanneer de woning netto elektriciteit teruglevert. Het beschikbare overschot kan dan worden gebruikt om de auto te laden. De bestaande SolarEdge-installatie kan hiervoor behouden blijven.
                    - 'link "Bron 1: Sigenergy, Sigen EV AC Charger" [ref=e132] [cursor=pointer]':
                      - /url: https://eu-store.sigenergy.com/en/pages/sigenstor-ev-ac
                      - text: Bron 1
