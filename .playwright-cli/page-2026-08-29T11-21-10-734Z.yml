                  - paragraph [ref=e176]:
                    - text: De Sigen EV AC is niet geschikt voor bidirectioneel laden. De Kia EV3 is hierop voorbereid, maar Kia geeft aan dat V2G en V2H in Nederland nog niet daadwerkelijk kunnen worden gebruikt. Easee Charge Max is hardwarematig V2G-ready, terwijl de consumentendienst nog niet beschikbaar is en de laadregeling dan buiten het Sigenergy-systeem komt te liggen.
